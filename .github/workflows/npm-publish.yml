name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-gate:
    name: Verify release on all browsers
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build untracked package type exports
        run: pnpm build:types

      - name: Verify generated CSS before any CSS build
        run: pnpm check:generated

      - name: Run static checks
        run: pnpm check

      - name: Run the public test aggregate
        run: pnpm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Install release browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser release tests
        run: pnpm test:browser:all

  publish:
    name: Publish package
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies without lifecycle builds
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Publish to npm
        run: npm publish
